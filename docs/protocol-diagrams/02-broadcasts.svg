<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 892" font-family="Consolas,'Courier New',monospace" font-size="11">
  <defs>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  </defs>
  <rect width="1400" height="892" fill="#fafafa"/>
  <text x="700" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Phase 2 — Steady-State Broadcasts</text>
  <text x="700" y="48" text-anchor="middle" font-size="11" fill="#64748b">Gateway → ALL connected clients (operators + nodes). Event frames, no response expected.</text>

  <!-- Sequence -->
  <rect x="70" y="66" width="70" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">Operator</text>
  <rect x="260" y="66" width="70" height="22" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="295" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#3730a3">Gateway</text>
  <rect x="450" y="66" width="70" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="485" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">Node</text>
  <line x1="105" y1="88" x2="105" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="295" y1="88" x2="295" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="485" y1="88" x2="485" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="295" y1="110" x2="113" y2="110" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <line x1="295" y1="110" x2="477" y2="110" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <text x="295" y="106" text-anchor="middle" font-size="8" font-weight="bold" fill="#7c3aed">tick (30s)</text>

  <line x1="295" y1="136" x2="113" y2="136" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <line x1="295" y1="136" x2="477" y2="136" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <text x="295" y="132" text-anchor="middle" font-size="8" font-weight="bold" fill="#7c3aed">health (60s)</text>

  <line x1="295" y1="162" x2="113" y2="162" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <line x1="295" y1="162" x2="477" y2="162" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <text x="295" y="158" text-anchor="middle" font-size="8" font-weight="bold" fill="#7c3aed">presence (on change)</text>

  <line x1="295" y1="188" x2="113" y2="188" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <line x1="295" y1="188" x2="477" y2="188" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <text x="295" y="184" text-anchor="middle" font-size="8" font-weight="bold" fill="#7c3aed">shutdown</text>

  <line x1="295" y1="214" x2="113" y2="214" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <line x1="295" y1="214" x2="477" y2="214" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <text x="295" y="210" text-anchor="middle" font-size="8" font-weight="bold" fill="#7c3aed">update.available</text>

  <line x1="295" y1="240" x2="113" y2="240" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <line x1="295" y1="240" x2="477" y2="240" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ap)"/>
  <text x="295" y="236" text-anchor="middle" font-size="8" font-weight="bold" fill="#7c3aed">heartbeat</text>

  <line x1="295" y1="270" x2="477" y2="270" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ap)"/>
  <text x="386" y="266" text-anchor="middle" font-size="8" font-weight="bold" fill="#c2410c">voicewake.changed</text>
  <text x="386" y="286" text-anchor="middle" font-size="7" fill="#94a3b8">(node-only, on connect + config change)</text>

  <!-- Detail panels -->
  <rect x="560" y="66" width="820" height="120" rx="6" fill="#fff" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="560" y="66" width="820" height="20" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="574" y="80" font-size="11" font-weight="bold" fill="#7c3aed">tick</text>
  <text x="620" y="80" font-size="9" fill="#94a3b8">Every 30s (TICK_INTERVAL_MS). Keepalive heartbeat. Source: server-maintenance.ts</text>
  <text x="574" y="102" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"event"</tspan>, "event": <tspan fill="#059669">"tick"</tspan>, "payload": {</text>
  <text x="590" y="120" font-size="10"><tspan fill="#dc2626" font-weight="bold">"ts"</tspan>: <tspan fill="#2563eb">1711234567890</tspan>     <tspan fill="#94a3b8">// int, Date.now() on gateway</tspan></text>
  <text x="574" y="138" font-size="10" fill="#475569">}, "seq": <tspan fill="#2563eb">42</tspan> }</text>
  <text x="574" y="158" font-size="9" fill="#94a3b8">Client watchdog: if no message (any type) received within tickIntervalMs × 2 (60s),</text>
  <text x="574" y="172" font-size="9" fill="#94a3b8">client closes connection with code 4000. Every received message resets the timer.</text>

  <rect x="560" y="196" width="820" height="112" rx="6" fill="#fff" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="560" y="196" width="820" height="20" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="574" y="210" font-size="11" font-weight="bold" fill="#7c3aed">health</text>
  <text x="630" y="210" font-size="9" fill="#94a3b8">Every 60s (HEALTH_REFRESH_INTERVAL_MS). Source: server-maintenance.ts</text>
  <text x="574" y="232" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"event"</tspan>, "event": <tspan fill="#059669">"health"</tspan>, "payload": {</text>
  <text x="590" y="250" font-size="10" fill="#94a3b8">/* HealthSummary: channel connection statuses, model availability,</text>
  <text x="590" y="266" font-size="10" fill="#94a3b8">   linked phone numbers, service health checks, etc. */</text>
  <text x="574" y="284" font-size="10" fill="#475569">}, "stateVersion": { "health": <tspan fill="#2563eb">N</tspan> } }</text>
  <text x="574" y="302" font-size="9" fill="#94a3b8">Health is computed async via getHealthSnapshot(). Version counter increments on each refresh.</text>

  <rect x="560" y="318" width="820" height="72" rx="6" fill="#fff" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="560" y="318" width="820" height="20" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="574" y="332" font-size="11" font-weight="bold" fill="#7c3aed">presence</text>
  <text x="644" y="332" font-size="9" fill="#94a3b8">On connect/disconnect. Source: server/presence-events.ts</text>
  <text x="574" y="354" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"event"</tspan>, "event": <tspan fill="#059669">"presence"</tspan>, "payload": [</text>
  <text x="590" y="372" font-size="10">{ <tspan fill="#059669">"host"</tspan>: <tspan fill="#059669">"MacBook"</tspan>, <tspan fill="#059669">"version"</tspan>: <tspan fill="#059669">"2026.3.12"</tspan>, <tspan fill="#059669">"mode"</tspan>: <tspan fill="#059669">"node"</tspan>, <tspan fill="#059669">"deviceId"</tspan>: <tspan fill="#059669">"..."</tspan>, <tspan fill="#059669">"ts"</tspan>: <tspan fill="#2563eb">...</tspan> }</text>
  <text x="574" y="390" font-size="10" fill="#475569">], "stateVersion": { "presence": <tspan fill="#2563eb">N</tspan> } }</text>

  <rect x="560" y="400" width="820" height="52" rx="6" fill="#fff" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="560" y="400" width="820" height="20" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="574" y="414" font-size="11" font-weight="bold" fill="#7c3aed">shutdown</text>
  <text x="640" y="414" font-size="9" fill="#94a3b8">When gateway is shutting down gracefully.</text>
  <text x="574" y="436" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"event"</tspan>, "event": <tspan fill="#059669">"shutdown"</tspan>, "payload": {</text>
  <text x="590" y="452" font-size="10"><tspan fill="#dc2626" font-weight="bold">"reason"</tspan>: <tspan fill="#059669">"restart"</tspan>,  <tspan fill="#64748b">"restartExpectedMs"</tspan>: <tspan fill="#2563eb">5000</tspan>  <tspan fill="#94a3b8">// int?, time until restart</tspan></text>

  <rect x="560" y="462" width="820" height="56" rx="6" fill="#fff" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="560" y="462" width="820" height="20" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="574" y="476" font-size="11" font-weight="bold" fill="#7c3aed">update.available</text>
  <text x="710" y="476" font-size="9" fill="#94a3b8">When startup update check detects newer version.</text>
  <text x="574" y="498" font-size="10" fill="#475569">{ "event": <tspan fill="#059669">"update.available"</tspan>, "payload": {</text>
  <text x="590" y="516" font-size="10"><tspan fill="#dc2626" font-weight="bold">"currentVersion"</tspan>: <tspan fill="#059669">"2026.3.10"</tspan>, <tspan fill="#dc2626" font-weight="bold">"latestVersion"</tspan>: <tspan fill="#059669">"2026.3.12"</tspan>, <tspan fill="#dc2626" font-weight="bold">"channel"</tspan>: <tspan fill="#059669">"stable"</tspan> } }</text>

  <rect x="560" y="528" width="820" height="72" rx="6" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
  <rect x="560" y="528" width="820" height="20" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="574" y="542" font-size="11" font-weight="bold" fill="#c2410c">voicewake.changed</text>
  <text x="730" y="542" font-size="9" fill="#94a3b8">Targeted to NODES only (not operators). On connect + config change.</text>
  <text x="574" y="564" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"event"</tspan>, "event": <tspan fill="#059669">"voicewake.changed"</tspan>, "payload": {</text>
  <text x="590" y="582" font-size="10"><tspan fill="#dc2626" font-weight="bold">"triggers"</tspan>: [<tspan fill="#059669">"hey openclaw"</tspan>, <tspan fill="#059669">"openclaw"</tspan>]     <tspan fill="#94a3b8">// str[], wake word phrases</tspan></text>
  <text x="574" y="600" font-size="10" fill="#475569">} }</text>

  <rect x="560" y="610" width="820" height="52" rx="6" fill="#fff" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="560" y="610" width="820" height="20" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="574" y="624" font-size="11" font-weight="bold" fill="#7c3aed">heartbeat</text>
  <text x="650" y="624" font-size="9" fill="#94a3b8">Only when configured via set-heartbeats method.</text>
  <text x="574" y="646" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"event"</tspan>, "event": <tspan fill="#059669">"heartbeat"</tspan>, "payload": { ... } }</text>
  <text x="574" y="662" font-size="9" fill="#94a3b8">User-configurable heartbeat separate from the system tick.</text>

  <!-- Session/chat broadcasts -->
  <rect x="560" y="672" width="820" height="168" rx="6" fill="#fff" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="560" y="672" width="820" height="20" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="574" y="686" font-size="11" font-weight="bold" fill="#7c3aed">Session &amp; Chat Broadcasts (to subscribed operators)</text>
  <text x="574" y="710" font-size="10" font-weight="bold" fill="#475569">session.message</text>
  <text x="720" y="710" font-size="10" fill="#94a3b8">Chat message events for subscribed sessions</text>
  <text x="574" y="728" font-size="10" font-weight="bold" fill="#475569">session.tool</text>
  <text x="720" y="728" font-size="10" fill="#94a3b8">Tool call events (for clients with "tool-events" capability)</text>
  <text x="574" y="746" font-size="10" font-weight="bold" fill="#475569">sessions.changed</text>
  <text x="720" y="746" font-size="10" fill="#94a3b8">Session list changed (created, deleted, etc.)</text>
  <text x="574" y="764" font-size="10" font-weight="bold" fill="#475569">chat</text>
  <text x="720" y="764" font-size="10" fill="#94a3b8">WebChat streaming token deltas</text>
  <text x="574" y="782" font-size="10" font-weight="bold" fill="#475569">agent</text>
  <text x="720" y="782" font-size="10" fill="#94a3b8">Agent execution events (tool calls, results, thinking)</text>
  <text x="574" y="802" font-size="10" font-weight="bold" fill="#475569">cron</text>
  <text x="720" y="802" font-size="10" fill="#94a3b8">Cron job execution progress</text>
  <text x="574" y="822" font-size="10" font-weight="bold" fill="#475569">device.pair.requested</text>
  <text x="720" y="822" font-size="10" fill="#94a3b8">When a new device attempts to pair</text>
  <text x="574" y="840" font-size="10" font-weight="bold" fill="#475569">device.pair.resolved</text>
  <text x="720" y="840" font-size="10" fill="#94a3b8">When a pairing request is approved/rejected</text>
</svg>
