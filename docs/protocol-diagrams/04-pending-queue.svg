<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1710" font-family="Consolas,'Courier New',monospace" font-size="11">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1400" height="1710" fill="#fafafa"/>
  <text x="700" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Phase 4 — Pending Work Queue</text>
  <text x="700" y="48" text-anchor="middle" font-size="11" fill="#64748b">Enqueue work for offline nodes. Nodes drain, ack, and long-poll for pending items.</text>

  <!-- Actors + lifelines -->
  <rect x="30" y="66" width="70" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">Operator</text>
  <rect x="210" y="66" width="70" height="22" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="245" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#3730a3">Gateway</text>
  <rect x="400" y="66" width="70" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="435" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">Node</text>
  <line x1="65" y1="88" x2="65" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="245" y1="88" x2="245" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="435" y1="88" x2="435" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Step 1: Operator -> Gateway -->
  <line x1="73" y1="116" x2="237" y2="116" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="155" y="112" text-anchor="middle" font-size="8" font-weight="bold" fill="#1d4ed8">req: node.pending.enqueue</text>

  <!-- Step 2: Node -> Gateway (drain) -->
  <line x1="427" y1="156" x2="253" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="340" y="152" text-anchor="middle" font-size="8" font-weight="bold" fill="#1d4ed8">req: node.pending.drain</text>

  <!-- Step 3: Node -> Gateway (ack) -->
  <line x1="427" y1="196" x2="253" y2="196" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="340" y="192" text-anchor="middle" font-size="8" font-weight="bold" fill="#1d4ed8">req: node.pending.ack</text>

  <!-- Step 4: Node -> Gateway (pull / long-poll) -->
  <line x1="427" y1="236" x2="253" y2="236" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="340" y="232" text-anchor="middle" font-size="8" font-weight="bold" fill="#1d4ed8">req: node.pending.pull</text>
  <text x="340" y="248" text-anchor="middle" font-size="7" fill="#94a3b8">long-poll, blocks until work arrives</text>

  <line x1="245" y1="276" x2="427" y2="276" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="336" y="272" text-anchor="middle" font-size="8" font-weight="bold" fill="#15803d">res: {items, hasMore}</text>

  <text x="250" y="312" text-anchor="middle" font-size="8" fill="#94a3b8">Constants: NODE_PENDING_ACTION_TTL_MS = 10 min, NODE_PENDING_ACTION_MAX_PER_NODE = 64</text>

  <!-- ═══ MESSAGE 1: node.pending.enqueue ═══ -->
  <rect x="20" y="354" width="1360" height="326" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="354" width="1360" height="22" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="34" y="370" font-size="12" font-weight="bold" fill="#1d4ed8">1. req: node.pending.enqueue</text>
  <text x="310" y="370" font-size="10" fill="#94a3b8">Operator → Gateway</text>

  <text x="34" y="396" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"req"</tspan>,  "id": <tspan fill="#059669">"&lt;uuid&gt;"</tspan>,  "method": <tspan fill="#059669">"node.pending.enqueue"</tspan>,  "params": {</text>

  <text x="50" y="420" font-size="10"><tspan fill="#dc2626" font-weight="bold">"nodeId"</tspan>:       <tspan fill="#059669">"a1b2c3d4..."</tspan>        <tspan fill="#94a3b8">// str, target node device ID</tspan></text>
  <text x="50" y="438" font-size="10"><tspan fill="#dc2626" font-weight="bold">"type"</tspan>:         <tspan fill="#059669">"status.request"</tspan>      <tspan fill="#94a3b8">// str, "status.request" | "location.request"</tspan></text>
  <text x="50" y="456" font-size="10"><tspan fill="#64748b">"priority"</tspan>:     <tspan fill="#059669">"normal"</tspan>              <tspan fill="#94a3b8">// str?, "normal" | "high"</tspan></text>
  <text x="50" y="474" font-size="10"><tspan fill="#64748b">"expiresInMs"</tspan>:  <tspan fill="#2563eb">600000</tspan>                <tspan fill="#94a3b8">// int?, range: 1000-86400000 (1s to 24h)</tspan></text>
  <text x="50" y="492" font-size="10"><tspan fill="#64748b">"wake"</tspan>:         <tspan fill="#2563eb">true</tspan>                  <tspan fill="#94a3b8">// bool?, trigger APNS push to wake node</tspan></text>
  <text x="34" y="512" font-size="10" fill="#475569">} }</text>

  <text x="34" y="540" font-size="9" fill="#334155" font-weight="bold">Response:</text>
  <text x="34" y="558" font-size="10" fill="#475569">{ "ok": <tspan fill="#2563eb">true</tspan>, "payload": {</text>
  <text x="50" y="576" font-size="10"><tspan fill="#dc2626" font-weight="bold">"nodeId"</tspan>:        <tspan fill="#059669">"a1b2c3d4..."</tspan>,</text>
  <text x="50" y="594" font-size="10"><tspan fill="#dc2626" font-weight="bold">"revision"</tspan>:      <tspan fill="#2563eb">7</tspan>,                    <tspan fill="#94a3b8">// int, queue revision counter</tspan></text>
  <text x="50" y="612" font-size="10"><tspan fill="#dc2626" font-weight="bold">"queued"</tspan>:        { <tspan fill="#059669">"id"</tspan>: <tspan fill="#059669">"..."</tspan>, <tspan fill="#059669">"type"</tspan>: <tspan fill="#059669">"status.request"</tspan>, <tspan fill="#059669">"priority"</tspan>: <tspan fill="#059669">"normal"</tspan>,</text>
  <text x="50" y="630" font-size="10">                   <tspan fill="#059669">"createdAtMs"</tspan>: <tspan fill="#2563eb">1711234567890</tspan>, <tspan fill="#059669">"expiresAtMs"</tspan>: <tspan fill="#2563eb">1711235167890</tspan> },</text>
  <text x="50" y="648" font-size="10"><tspan fill="#dc2626" font-weight="bold">"wakeTriggered"</tspan>: <tspan fill="#2563eb">true</tspan>               <tspan fill="#94a3b8">// bool, whether APNS push was sent</tspan></text>
  <text x="34" y="666" font-size="10" fill="#475569">} }</text>

  <!-- ═══ MESSAGE 2: node.pending.drain ═══ -->
  <rect x="20" y="694" width="1360" height="312" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="694" width="1360" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="34" y="710" font-size="12" font-weight="bold" fill="#92400e">2. req: node.pending.drain</text>
  <text x="290" y="710" font-size="10" fill="#94a3b8">Node → Gateway</text>

  <text x="34" y="736" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"req"</tspan>,  "id": <tspan fill="#059669">"&lt;uuid&gt;"</tspan>,  "method": <tspan fill="#059669">"node.pending.drain"</tspan>,  "params": {</text>

  <text x="50" y="760" font-size="10"><tspan fill="#64748b">"maxItems"</tspan>:  <tspan fill="#2563eb">5</tspan>                    <tspan fill="#94a3b8">// int?, range: 1-10</tspan></text>
  <text x="34" y="780" font-size="10" fill="#475569">} }</text>

  <text x="34" y="808" font-size="9" fill="#334155" font-weight="bold">Response:</text>
  <text x="34" y="826" font-size="10" fill="#475569">{ "ok": <tspan fill="#2563eb">true</tspan>, "payload": {</text>
  <text x="50" y="844" font-size="10"><tspan fill="#dc2626" font-weight="bold">"nodeId"</tspan>:    <tspan fill="#059669">"a1b2c3d4..."</tspan>,</text>
  <text x="50" y="862" font-size="10"><tspan fill="#dc2626" font-weight="bold">"revision"</tspan>:  <tspan fill="#2563eb">7</tspan>,</text>
  <text x="50" y="880" font-size="10"><tspan fill="#dc2626" font-weight="bold">"items"</tspan>:     [</text>
  <text x="66" y="898" font-size="10">{ <tspan fill="#dc2626" font-weight="bold">"id"</tspan>: <tspan fill="#059669">"..."</tspan>, <tspan fill="#dc2626" font-weight="bold">"type"</tspan>: <tspan fill="#059669">"status.request"</tspan>, <tspan fill="#dc2626" font-weight="bold">"priority"</tspan>: <tspan fill="#059669">"normal"</tspan>,</text>
  <text x="74" y="916" font-size="10"><tspan fill="#dc2626" font-weight="bold">"createdAtMs"</tspan>: <tspan fill="#2563eb">1711234567890</tspan>, <tspan fill="#64748b">"expiresAtMs"</tspan>: <tspan fill="#2563eb">1711235167890</tspan>, <tspan fill="#64748b">"payload"</tspan>: { ... } }</text>
  <text x="50" y="934" font-size="10">],</text>
  <text x="50" y="952" font-size="10"><tspan fill="#dc2626" font-weight="bold">"hasMore"</tspan>:   <tspan fill="#2563eb">false</tspan>              <tspan fill="#94a3b8">// bool, more items remain in queue</tspan></text>
  <text x="34" y="972" font-size="10" fill="#475569">} }</text>
  <text x="34" y="992" font-size="9" fill="#94a3b8">priority values: "default" | "normal" | "high". expiresAtMs may be null if no expiry set.</text>

  <!-- ═══ MESSAGE 3: node.pending.ack ═══ -->
  <rect x="20" y="1020" width="1360" height="166" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="1020" width="1360" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="34" y="1036" font-size="12" font-weight="bold" fill="#92400e">3. req: node.pending.ack</text>
  <text x="270" y="1036" font-size="10" fill="#94a3b8">Node → Gateway (acknowledge processed items)</text>

  <text x="34" y="1062" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"req"</tspan>,  "id": <tspan fill="#059669">"&lt;uuid&gt;"</tspan>,  "method": <tspan fill="#059669">"node.pending.ack"</tspan>,  "params": {</text>

  <text x="50" y="1086" font-size="10"><tspan fill="#dc2626" font-weight="bold">"ids"</tspan>:  [<tspan fill="#059669">"item-id-1"</tspan>, <tspan fill="#059669">"item-id-2"</tspan>]    <tspan fill="#94a3b8">// str[], minimum 1 item</tspan></text>
  <text x="34" y="1106" font-size="10" fill="#475569">} }</text>

  <text x="34" y="1134" font-size="9" fill="#334155" font-weight="bold">Response:</text>
  <text x="34" y="1152" font-size="10" fill="#475569">{ "ok": <tspan fill="#2563eb">true</tspan> }</text>
  <text x="34" y="1178" font-size="9" fill="#94a3b8">Removes acknowledged items from the queue. Items not ack'd will be re-delivered on next drain/pull.</text>

  <!-- ═══ MESSAGE 4: node.pending.pull ═══ -->
  <rect x="20" y="1200" width="1360" height="198" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="1200" width="1360" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="34" y="1216" font-size="12" font-weight="bold" fill="#92400e">4. req: node.pending.pull</text>
  <text x="280" y="1216" font-size="10" fill="#94a3b8">Node → Gateway (long-poll for new work)</text>

  <text x="34" y="1242" font-size="10" fill="#475569">{ "type": <tspan fill="#059669">"req"</tspan>,  "id": <tspan fill="#059669">"&lt;uuid&gt;"</tspan>,  "method": <tspan fill="#059669">"node.pending.pull"</tspan>,  "params": {} }</text>

  <text x="34" y="1270" font-size="9" fill="#334155" font-weight="bold">Behavior:</text>
  <text x="34" y="1288" font-size="9" fill="#475569">Long-poll: blocks until work arrives in the queue. Response format is same as drain.</text>

  <text x="34" y="1314" font-size="9" fill="#334155" font-weight="bold">Response (when items arrive):</text>
  <text x="34" y="1332" font-size="10" fill="#475569">{ "ok": <tspan fill="#2563eb">true</tspan>, "payload": {</text>
  <text x="50" y="1350" font-size="10"><tspan fill="#dc2626" font-weight="bold">"nodeId"</tspan>: <tspan fill="#059669">"..."</tspan>, <tspan fill="#dc2626" font-weight="bold">"revision"</tspan>: <tspan fill="#2563eb">N</tspan>, <tspan fill="#dc2626" font-weight="bold">"items"</tspan>: [...], <tspan fill="#dc2626" font-weight="bold">"hasMore"</tspan>: <tspan fill="#2563eb">false</tspan></text>
  <text x="34" y="1370" font-size="10" fill="#475569">} }</text>
  <text x="34" y="1390" font-size="9" fill="#94a3b8">Source: src/gateway/server/methods/node-pending.ts</text>

  <!-- Constants box -->
  <rect x="20" y="1412" width="1360" height="284" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="1412" width="1360" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="34" y="1428" font-size="12" font-weight="bold" fill="#334155">Queue Constants &amp; Behavior</text>

  <text x="34" y="1456" font-size="10" font-weight="bold" fill="#334155">Constants</text>
  <text x="34" y="1474" font-size="10" fill="#475569">NODE_PENDING_ACTION_TTL_MS:          <tspan font-weight="bold">600000</tspan>  (10 minutes)</text>
  <text x="34" y="1492" font-size="10" fill="#475569">NODE_PENDING_ACTION_MAX_PER_NODE:    <tspan font-weight="bold">64</tspan>      (max queued items per node)</text>

  <text x="34" y="1520" font-size="10" font-weight="bold" fill="#334155">Item Types</text>
  <text x="34" y="1538" font-size="10" fill="#475569"><tspan fill="#059669">"status.request"</tspan>      — requests node to report its current status</text>
  <text x="34" y="1556" font-size="10" fill="#475569"><tspan fill="#059669">"location.request"</tspan>    — requests node to report its location</text>

  <text x="34" y="1584" font-size="10" font-weight="bold" fill="#334155">Priority Levels</text>
  <text x="34" y="1602" font-size="10" fill="#475569"><tspan fill="#059669">"default"</tspan>   — standard priority (alias for normal)</text>
  <text x="34" y="1620" font-size="10" fill="#475569"><tspan fill="#059669">"normal"</tspan>    — standard priority</text>
  <text x="34" y="1638" font-size="10" fill="#475569"><tspan fill="#059669">"high"</tspan>      — elevated priority, processed first</text>

  <text x="34" y="1666" font-size="9" fill="#94a3b8">Expired items are automatically pruned. Queue is in-memory on gateway (not persisted across restarts).</text>
  <text x="34" y="1682" font-size="9" fill="#94a3b8">Source: src/gateway/server/node-pending-queue.ts</text>
</svg>