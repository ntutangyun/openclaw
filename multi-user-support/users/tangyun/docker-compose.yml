networks:
  openclaw-tangyun-net:
    driver: bridge

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: openclaw-tangyun-gateway
    networks:
      - openclaw-tangyun-net
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      # ── Verbose logging & diagnostics ──
      OPENCLAW_LOG_LEVEL: debug
      OPENCLAW_RAW_STREAM: "1"
      OPENCLAW_RAW_STREAM_PATH: /home/node/.openclaw/logs/raw-stream.jsonl
      OPENCLAW_CACHE_TRACE: "1"
      OPENCLAW_CACHE_TRACE_FILE: /home/node/.openclaw/logs/cache-trace.jsonl
      OPENCLAW_CACHE_TRACE_MESSAGES: "1"
      OPENCLAW_CACHE_TRACE_PROMPT: "1"
      OPENCLAW_CACHE_TRACE_SYSTEM: "1"
      OPENCLAW_DIAGNOSTICS: "*"
    volumes:
      - openclaw-tangyun-config:/home/node/.openclaw
      - openclaw-tangyun-workspace:/home/node/.openclaw/workspace
    ports:
      - "19000:18789"
      - "19001:18790"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "--max-old-space-size=2048",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
        "--verbose",
        "--ws-log",
        "full",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: openclaw-tangyun-cli
    networks:
      - openclaw-tangyun-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_URL: ws://openclaw-gateway:18789
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
      BROWSER: echo
    volumes:
      - openclaw-tangyun-config:/home/node/.openclaw
      - openclaw-tangyun-workspace:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

volumes:
  openclaw-tangyun-config:
  openclaw-tangyun-workspace:
